[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nodsend-ai"
version = "0.1.0"
description = "Typed Python SDK and agent-framework adapters for Nodsend human approvals"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nodsend" }]
license = "MIT"
keywords = ["ai", "agents", "human-in-the-loop", "approvals", "langchain", "crewai", "autogen"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
langchain = ["langchain>=1.3.3,<2", "langgraph>=1.0,<2"]
crewai = ["crewai>=1.8,<2"]
autogen = ["autogen-agentchat>=0.7.5,<0.8", "autogen-core>=0.7.5,<0.8"]
dev = [
  "openapi-spec-validator>=0.7,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.urls]
Homepage = "https://nodsend.com"
Documentation = "https://nodsend.com/docs"
Repository = "https://github.com/Foreveryoung2149/agent-approvals"
Changelog = "https://github.com/Foreveryoung2149/agent-approvals/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/nodsend"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
