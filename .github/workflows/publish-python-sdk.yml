name: Publish Python SDK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed release tag to publish
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml

      - name: Install build and test dependencies
        run: python -m pip install --upgrade build twine "./sdks/python[dev]"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          PACKAGE_VERSION="$(python -c "import runpy; print(runpy.run_path('sdks/python/src/nodsend/_version.py')['__version__'])")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION" >&2
            exit 1
          }

      - name: Run SDK tests
        run: python -m pytest sdks/python/tests

      - name: Build distributions
        run: python -m build --sdist --wheel --outdir dist sdks/python

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/nodsend-ai/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
