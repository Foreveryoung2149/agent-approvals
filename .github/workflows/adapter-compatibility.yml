name: Python adapter compatibility

on:
  pull_request:
    paths:
      - "sdks/python/**"
      - ".github/workflows/adapter-compatibility.yml"
  push:
    branches: [main]
    paths:
      - "sdks/python/**"
      - ".github/workflows/adapter-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adapter-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-adapter:
    name: ${{ matrix.adapter }} on Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        adapter: [langchain, crewai, autogen]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml

      - name: Install SDK and native framework
        run: python -m pip install -e "sdks/python[dev,${{ matrix.adapter }}]"

      - name: Run adapter contracts
        run: python -m pytest sdks/python/tests/test_integrations.py
