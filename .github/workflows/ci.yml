name: Production CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nodsend
          POSTGRES_PASSWORD: nodsend
          POSTGRES_DB: nodsend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodsend -d nodsend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nodsend:nodsend@localhost:5432/nodsend_test?schema=public
      SESSION_SECRET: ci-session-secret-with-more-than-thirty-two-characters
      AUTH_CODE_PEPPER: ci-auth-code-pepper-with-more-than-thirty-two-characters
      TOTP_ENCRYPTION_KEY: 2222222222222222222222222222222222222222222222222222222222222222
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema api-server/prisma/schema.prisma

      - name: Apply committed migrations
        run: npx prisma migrate deploy --schema api-server/prisma/schema.prisma

      - name: Run real PostgreSQL invariants
        env:
          INTEGRATION_DATABASE_URL: postgresql://nodsend:nodsend@localhost:5432/nodsend_test?schema=public
        run: node --test api-server/tests/postgres-integration.test.js

      - name: Run backend security contracts
        run: npm run test:api

      - name: Type-check application
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Install Python SDK test dependencies
        run: python -m pip install -e "sdks/python[dev]"

      - name: Run SDK and OpenAPI tests
        run: python -m pytest sdks/python/tests

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production container
        run: docker build -t nodsend-ci .
